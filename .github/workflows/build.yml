name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bonoj/Crucible
          ref: d1c5e437197e72b16624c0b7104c6e9d9cbb0d0f
          path: vendor/crucible
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund --package-lock=false
      - name: Build pinned Crucible donor
        working-directory: vendor/crucible
        run: |
          npm install --no-audit --no-fund
          npm test
          GITHUB_SHA=d1c5e437197e72b16624c0b7104c6e9d9cbb0d0f node tools/build.mjs
          printf '%s  %s\n' '3355df58812cab9afabbfc33464ee67bf3a736912a1ff9edac7a3afc48ab6c12' 'dist/index.html' | sha256sum -c -
      - run: npm test
      - name: Verify executable artifact
        run: test -s dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: repository-${{ github.sha }}
          path: dist/
          if-no-files-found: error
      - name: Promote verified executable
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin live || true
          git worktree add /tmp/repository-live --detach
          cd /tmp/repository-live
          git checkout --orphan live-next
          git rm -rf . >/dev/null 2>&1 || true
          cp -R "$GITHUB_WORKSPACE/dist/." .
          git add -A
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "deploy ${GITHUB_SHA}"
          git push --force origin HEAD:live

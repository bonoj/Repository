<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Repository</title>
<style>
*{box-sizing:border-box}
html,body,#world{margin:0;width:100%;height:100%;overflow:hidden;background:#f1f1ef}
canvas{display:block}
#status{position:fixed;z-index:10;left:max(.7rem,env(safe-area-inset-left));top:max(.7rem,env(safe-area-inset-top));padding:.42rem .6rem;border:1px solid #7d858c33;border-radius:.45rem;background:#e4e4e0cc;color:#555d62;font:11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;pointer-events:none;backdrop-filter:blur(4px)}
#fault{position:fixed;left:12px;right:12px;bottom:12px;padding:12px;background:#351b1b;color:#ffb36b;font:12px/1.4 monospace;white-space:pre-wrap}
</style>
</head>
<body>
<div id="world"></div>
<output id="status">__BUILD__ • fps …</output>
<pre id="fault" hidden></pre>
<script type="module" src="./main.js"></script>
</body>
</html>

 let nearest=0,best=Infinity;

 for(let q=0;q<9;q++){shardPos[nearest].push(verts[i+q]);shardCol[nearest].push(cols[i+q])}
}

function stepDebris(dt){
 if(!debrisMode)return;
 if(reforming){
  reformTime+=dt;
  const attraction=10,damper=Math.exp(-3.1*dt);
  let maxError=0;
  for(let j=0;j<BB_TOTAL;j++){
   if(!bbReleased[j])continue;
   const i=j*3;
   for(let axis=0;axis<3;axis++){
    const q=i+axis,delta=bbOrigin[q]-bbPosition[q];

   }
  }
  if(reformTime>5.2 || (reformTime>3.2&&maxError<.13)){resetDebris();return}
 }else{
  blastTime+=dt;
  while(blastFired<10&&blastTime>=blastFired*.42){
   const b=blasts[blastFired],index=blastFired++;
   shardMeshes[index].visible=false;
   for(let j=0;j<BB_TOTAL;j++){
    if(bbGroup[j]!==index)continue;
    bbReleased[j]=1;
    const i=j*3,x=bbPosition[i]-b.x,y=bbPosition[i+1]-b.y,z=bbPosition[i+2]-b.z;
    const dist2=x*x+y*y+z*z+.8,inv=1/Math.sqrt(dist2);
    const spread=6+8/(1+dist2*.12),twist=hash(j,index,AST_SEED)-.5;
    bbVelocity[i]=x*inv*spread+b.dx*4+twist*4;
    bbVelocity[i+1]=y*inv*spread+b.dy*4+twist*2;
    bbVelocity[i+2]=z*inv*spread+b.dz*4-twist*4;
   }
  }
  const wall=INNER_R-.26,wall2=wall*wall,drag=Math.exp(-.085*dt);
  for(let j=0;j<BB_TOTAL;j++){
   if(!bbReleased[j])continue;
   const i=j*3;
   let x=bbPosition[i]+bbVelocity[i]*dt,y=bbPosition[i+1]+bbVelocity[i+1]*dt,z=bbPosition[i+2]+bbVelocity[i+2]*dt;
   const r2=x*x+y*y+z*z;
   if(r2>wall2){
    const inv=1/Math.sqrt(r2),nx=x*inv,ny=y*inv,nz=z*inv;
    x=nx*wall;y=ny*wall;z=nz*wall;
    const dot=bbVelocity[i]*nx+bbVelocity[i+1]*ny+bbVelocity[i+2]*nz;
    if(dot>0){bbVelocity[i]-=1.72*dot*nx;bbVelocity[i+1]-=1.72*dot*ny;bbVelocity[i+2]-=1.72*dot*nz}
   }
   bbPosition[i]=x;bbPosition[i+1]=y;bbPosition[i+2]=z;
   bbVelocity[i]*=drag;bbVelocity[i+1]*=drag;bbVelocity[i+2]*=drag;
  }
  if((collisionTick++&3)===0)for(let j=0;j<BB_TOTAL-1;j+=2){
   if(!bbReleased[j]||!bbReleased[j+1])continue;
   const i=j*3,k=i+3,dx=bbPosition[i]-bbPosition[k],dy=bbPosition[i+1]-bbPosition[k+1],dz=bbPosition[i+2]-bbPosition[k+2],d2=dx*dx+dy*dy+dz*dz;
   if(d2>.0001&&d2<.09){
    const push=(.3-Math.sqrt(d2))*.35/Math.sqrt(d2);
    bbVelocity[i]+=dx*push;bbVelocity[i+1]+=dy*push;bbVelocity[i+2]+=dz*push;
    bbVelocity[k]-=dx*push;bbVelocity[k+1]-=dy*push;bbVelocity[k+2]-=dz*push;
   }
  }
 }
 let n=0;
 for(let j=0;j<BB_TOTAL;j++)if(bbReleased[j]){
  const i=j*3,k=n++*3;
  bbActivePosition[k]=bbPosition[i];bbActivePosition[k+1]=bbPosition[i+1];bbActivePosition[k+2]=bbPosition[i+2];
  bbActiveColor[k]=bbColor[i];bbActiveColor[k+1]=bbColor[i+1];bbActiveColor[k+2]=bbColor[i+2];
 }
 releasedCount=n;activeGeo.setDrawRange(0,n);activeGeo.attributes.position.needsUpdate=true;
 activeGeo.attributes.color.needsUpdate=true;
}

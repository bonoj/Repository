<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101a"><title>Hermeticon · Wanderer — Terrain</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050b14;color:#f5dfb2;font-family:system-ui}canvas{display:block;touch-action:none}#stage{position:fixed;inset:0}#title{position:fixed;left:0;right:0;top:max(14px,env(safe-area-inset-top));text-align:center;pointer-events:none;text-shadow:0 3px 12px #000}h1{font:normal clamp(24px,5vw,43px) Georgia,serif;letter-spacing:.14em;margin:0}#tag{font-size:10px;letter-spacing:.25em;color:#c4b291;margin-top:7px}#hud{position:fixed;bottom:0;left:0;right:0;padding:25px 12px max(20px,env(safe-area-inset-bottom));text-align:center;background:linear-gradient(transparent,#050b14e8 35%)}#buttons{display:flex;justify-content:center;gap:9px}button{border:1px solid #9c8556aa;background:#15202acb;color:#f0d5a0;padding:13px 18px;border-radius:9px;font:600 12px system-ui;min-height:48px}#status{font:11px system-ui;letter-spacing:.08em;color:#c0c4c2;margin:0 0 12px}#error{position:fixed;top:35%;left:12px;right:12px;color:#ffb7a5;font:12px monospace;white-space:pre-wrap;text-align:center} #probe{position:fixed;top:82px;right:10px;top:120px;z-index:30;background:#101d29e8;color:#d9eced;border:1px solid #6f999e;border-radius:9px;padding:8px 12px;font:12px system-ui}#probePanel{display:none;position:fixed;inset:175px 9px 100px;z-index:29;background:#07121df2;color:#d9e6e5;overflow:auto;padding:14px;border:1px solid #6f999e;border-radius:10px;font:12px/1.45 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}#probePanel.open{display:block}#probeActions{display:flex;gap:8px;position:sticky;top:-14px;background:#07121d;padding:8px 0}#probeActions button{background:#223c4b;color:#fff;border:1px solid #648c9d;border-radius:6px;padding:9px}#buildRow{display:flex;justify-content:center;align-items:center;gap:5px;margin:3px auto 0;max-width:calc(100vw - 150px);color:#a6b7b9;font:11px ui-monospace,monospace;letter-spacing:.12em;pointer-events:auto}#build{font-size:10px;letter-spacing:0;overflow-wrap:anywhere;text-align:center}#fresh{display:inline-grid;place-items:center;width:40px;height:40px;min-height:40px;padding:0;border:0;background:transparent;color:#c4b291;font:23px system-ui;line-height:1;cursor:pointer} </style></head><body><div id="stage"></div><button id="probe" type="button">◉ INSPECT</button><div id="probePanel"><div id="probeActions"><button id="copyProbe">COPY REPORT</button><button id="closeProbe">CLOSE</button></div><div id="probeText"></div></div><div id="title"><h1>HERMETICON</h1><div id="tag">WANDERER · EQUATORIAL MATERIAL</div><div id="buildRow"><span id="build"></span><button id="fresh" type="button" title="Fetch latest build" aria-label="Fetch latest build">↻</button></div></div><div id="hud"><div id="status">SOLID TERRAIN · ZERO DATUM</div></div><div id="error"></div><script>
(function(){
 const el=document.getElementById('error');
 function fatal(error){
  const message=String(error&&error.stack||error&&error.message||error||'Unknown error');
  const report=['BAUBLE FAILED TO WAKE',message,'URL: '+location.href,'Time: '+new Date().toISOString()].join('\n');
  el.replaceChildren();
  el.style.cssText='position:fixed;z-index:9999;top:15%;bottom:12%;left:12px;right:12px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#211a20;color:#ffe1d6;padding:16px;border:2px solid #ff9784;border-radius:12px;font:13px/1.5 monospace';
  const heading=document.createElement('div');heading.textContent=report;el.append(heading);
  const button=document.createElement('button');button.textContent='COPY ERROR';button.style.cssText='display:block;width:100%;min-height:56px;margin:14px 0;font:700 17px system-ui';el.append(button);
  const manual=document.createElement('textarea');manual.value=report;manual.readOnly=true;manual.style.cssText='display:block;width:100%;min-height:110px;font:12px monospace';el.append(manual);
  button.onclick=async()=>{try{await navigator.clipboard.writeText(report);button.textContent='COPIED'}catch(_){manual.focus();manual.select();button.textContent='SELECTED — TAP COPY IN MENU'}};
 }
 window.BaubleFatal=fatal;
 addEventListener('error',e=>fatal(e.error||e.message));
 addEventListener('unhandledrejection',e=>fatal(e.reason));
})();
</script><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
try {
const BUILD='hermeticon-wanderer-equatorial-volume-v4';
document.querySelector('#build').textContent=BUILD;
document.querySelector('#fresh').onclick=()=>{const u=new URL(location.href);u.searchParams.set('fresh',Date.now().toString(36));location.replace(u.href)};
const scene=new THREE.Scene();scene.background=new THREE.Color(0x06101b);
const world=new THREE.Group();scene.add(world);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;document.querySelector('#stage').append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(42,1,.1,200);
scene.add(new THREE.HemisphereLight(0xb9d8e5,0x30303d,2));
const sun=new THREE.DirectionalLight(0xffd6a0,2.8);sun.position.set(-15,25,12);scene.add(sun);
const brass=new THREE.MeshStandardMaterial({color:0xb78b4e,metalness:.75,roughness:.3});
const glass=new THREE.MeshPhysicalMaterial({color:0xa5d9e2,transparent:true,opacity:.14,metalness:.05,roughness:.12,depthWrite:false,side:THREE.DoubleSide});
const BAUBLE_R=10.25;
const shell=new THREE.Mesh(new THREE.SphereGeometry(BAUBLE_R,48,32),glass);world.add(shell);
const rim=new THREE.Mesh(new THREE.TorusGeometry(10.14,.08,8,96),brass);rim.rotation.x=Math.PI/2;world.add(rim);
// World datum is the sphere equator: y=0. The specimen is a sealed,
// opaque solid, with two planar faces and a cylindrical boundary.
const INNER_R=10.07,TOP_Y=1.2,BOTTOM_Y=-1.2;
const MATERIAL_R=Math.sqrt(INNER_R*INNER_R-TOP_Y*TOP_Y)-.07;
const slabMaterial=new THREE.MeshStandardMaterial({color:0x9a8067,roughness:.92,metalness:0,side:THREE.FrontSide});
const slab=new THREE.Mesh(new THREE.CylinderGeometry(MATERIAL_R,MATERIAL_R,TOP_Y-BOTTOM_Y,128,1,false),slabMaterial);
slab.name='terrain:closed-equatorial-solid';slab.receiveShadow=true;slab.castShadow=true;world.add(slab);
const datum=new THREE.Mesh(new THREE.TorusGeometry(10.16,.022,6,128),new THREE.MeshBasicMaterial({color:0xe4c58d}));
datum.rotation.x=Math.PI/2;world.add(datum);
let angle=.7,elev=.35,dist=34,targetY=.5;
const pointers=new Map();
renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY})});
renderer.domElement.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=pointers.get(e.pointerId);const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;if(pointers.size===1){angle-=dx*.005;elev=Math.max(-1.25,Math.min(1.35,elev+dy*.005))}else{dist=Math.max(19,Math.min(65,dist-dy*.025))}});
for(const ev of ['pointerup','pointercancel'])renderer.domElement.addEventListener(ev,e=>pointers.delete(e.pointerId));
renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(19,Math.min(65,dist+e.deltaY*.018))},{passive:true});
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
let frames=0,frameMs=0,last=performance.now(),fps=0;
const panel=document.querySelector('#probePanel'),probeText=document.querySelector('#probeText');
function inspectWorld(){
 const report={build:BUILD,time:new Date().toISOString(),integration:{source:'sealed equatorial volume; no geology or water instantiated',controlsRequired:false},viewport:{width:innerWidth,height:innerHeight,pixelRatio:renderer.getPixelRatio()},vessel:{outerRadius:BAUBLE_R,innerRadius:INNER_R},datum:{worldY:0,equatorial:true},terrain:{kind:'closed-solid-volume',topY:TOP_Y,bottomY:BOTTOM_Y,radius:MATERIAL_R,thickness:TOP_Y-BOTTOM_Y,topFace:'opaque',bottomFace:'opaque',side:'sealed',volume:Math.PI*MATERIAL_R*MATERIAL_R*(TOP_Y-BOTTOM_Y)},render:{calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,geometries:renderer.info.memory.geometries,textures:renderer.info.memory.textures},performance:{fpsApprox:fps},warnings:[]};
 const t=JSON.stringify(report,null,2);probeText.textContent=t;return t;
}
document.querySelector('#probe').onclick=()=>{panel.classList.toggle('open');if(panel.classList.contains('open'))inspectWorld()};
document.querySelector('#closeProbe').onclick=()=>panel.classList.remove('open');
document.querySelector('#copyProbe').onclick=async()=>{const t=inspectWorld();try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}};
globalThis.BaubleInspect=inspectWorld;
function frame(now){requestAnimationFrame(frame);frames++;frameMs+=now-last;last=now;if(frameMs>=2500){fps=1000*frames/frameMs;frames=0;frameMs=0;if(panel.classList.contains('open'))inspectWorld()}camera.position.set(Math.sin(angle)*Math.cos(elev)*dist,Math.sin(elev)*dist+targetY,Math.cos(angle)*Math.cos(elev)*dist);camera.lookAt(0,targetY,0);renderer.render(scene,camera)}
requestAnimationFrame(frame);
}catch(e){window.BaubleFatal(e);console.error(e)}
</script></body></html>

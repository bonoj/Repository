let angle=.6,elev=.27,dist=27,targetY=0,lastX=0,lastY=0;
const pointers=new Map();let pinch=0;renderer.domElement.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,[e.clientX,e.clientY]);lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});

function end(e){pointers.delete(e.pointerId);pinch=0}renderer.domElement.addEventListener('pointerup',end);renderer.domElement.addEventListener('pointercancel',end);renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist=T.MathUtils.clamp(dist+e.deltaY*.022,2,100)},{passive:false});
function fitBaubleDistance(){const halfV=T.MathUtils.degToRad(camera.fov)/2;const halfH=Math.atan(Math.tan(halfV)*camera.aspect);return BAUBLE_R/Math.sin(Math.min(halfV,halfH))*1.12}let firstFit=true;function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();const fit=fitBaubleDistance();if(firstFit){dist=fit;firstFit=false}else dist=T.MathUtils.clamp(dist,2,100)}addEventListener('resize',resize);resize();

const probeButton=document.querySelector('#probe'),probePanel=document.querySelector('#probePanel'),probeText=document.querySelector('#probeText');
let probeReport='',probeLast=0,probeFrames=0,probeFrameMs=0,displayFps=null,fpsMeasuring=true;
function inspectWorld(){
 measureGpuAperture();
 measureSceneEyes();
 geometryEyes.shaderOffsetError=apertureUniform?round(Math.hypot(apertureUniform.value.x-wanderX,apertureUniform.value.y,apertureUniform.value.z-wanderZ),5):null;
 camera.updateMatrixWorld();world.updateMatrixWorld(true);
 const center=new T.Vector3(0,0,0).project(camera);
 const eyesWarnings=[];
 if(gpuEyes.status!=='pass')eyesWarnings.push('GPU_APERTURE_WITNESS_'+gpuEyes.status.toUpperCase());
 if(sceneEyes.status!=='pass')eyesWarnings.push('SCENE_PROJECTION_'+sceneEyes.status.toUpperCase());
 if(!apertureEyes.compileCount)eyesWarnings.push('APERTURE_SHADER_NOT_COMPILED');
 if(!apertureEyes.vertexHook||!apertureEyes.fragmentHook)eyesWarnings.push('APERTURE_SHADER_INJECTION_MISSING');
 if(apertureEyes.compileFailures.length)eyesWarnings.push('APERTURE_SHADER_COMPILE_HOOK_FAILURE');
 if(terrainBuildCount!==1)eyesWarnings.push('TERRAIN_REBUILT_DURING_TRAVERSAL');
 if(geometryEyes.fieldEdgeClearance<0)eyesWarnings.push('WORLD_FIELD_EDGE_INSIDE_APERTURE');
 if(geometryEyes.shaderOffsetError!==null&&geometryEyes.shaderOffsetError>.001)eyesWarnings.push('APERTURE_UNIFORM_OFFSET_MISMATCH');
 
 const report={build:BUILD,waterworld:{mode:'waterworld-v25-instanced-beads-no-solver',grid:null,cellSize:WD,source:sourcePosition,basin:transportSite.basin,hole:transportSite.hole,emitted:round(emitted,4),surface:round(poolVolume(),4),inFlight:round(dropMass(),4),collected:round(collected,4),drained:round(drained,4),lost:round(lost,4),conservationResidual:round(emitted-poolVolume()-dropMass()-collected-lost,6),activeDrops:drops.length,pooledBeads:pooledBeads.length,transportSteps,hydrology:{...hydrologyEyes,fluxVolume:round(hydrologyEyes.fluxVolume,4),maxDepth:round(hydrologyEyes.maxDepth,4),maxSpeed:round(hydrologyEyes.maxSpeed,4),minimumDepth:round(hydrologyEyes.minimumDepth,4),maximumSurface:round(hydrologyEyes.maximumSurface,4),poolVolume:round(poolVolume(),4),surfaceDomainCells:WN,drainCells:null,unitVolume:DROP_VOLUME,rateUnitsPerSecond:EMISSION_RATE*DROP_VOLUME}},runtimeEyes:{aperture:{...apertureEyes,compiled:apertureEyes.compileCount>0},gpu:gpuEyes,scene:sceneEyes,skin:skinEyes,scoop:scoopEyes,geometry:geometryEyes,warnings:eyesWarnings,limits:'Shared live aperture uniform; 4-position radial witness; lit 32x32 real terrain pixel occupancy. Blind scene is a failure. Projection cannot alone diagnose valid terrain silhouettes or glass composition.'},wanderer:{x:wanderX,z:wanderZ,step:WANDER_STEP,history:wanderHistory.slice(),drifting:!!driftDirection,centralRadius:3,apertureRadius:9.72,mode:'vertex-initialized-fragment-sphere-scoop',extractionMargin:EXTRACTION_MARGIN,worldFieldStable:true},terrain:{kind:'3d-signed-field',dimensions:[NX,NY,NZ],samples:field.length,fieldRange:[fieldMin,fieldMax],solidSamples:solidCount,voidSamples:voidCount,mesh:{triangles,vertices:geo.attributes.position.count,doubleSided:true},cycle,seed,buildMs,operationCount:operations.length,events:events.map(e=>({cycle:e.cycle,seed:e.seed,triangles:e.triangles,buildMs:e.buildMs,operationCount:e.operations?.length||0}))},time:new Date().toISOString(),viewport:{width:innerWidth,height:innerHeight,pixelRatio:round(renderer.getPixelRatio())},camera:{distance:round(dist),azimuth:round(angle),elevation:round(elev),targetY:round(targetY),fov:camera.fov,worldOrigin:{x:round((center.x+1)*innerWidth/2),y:round((1-center.y)*innerHeight/2)}},vessel:{outerRadius:BAUBLE_R,innerRadius:INNER_R,glassThickness:round(BAUBLE_R-INNER_R),inhabitants:1,contentsInstantiated:true},render:{calls:mainRenderStats.calls,triangles:mainRenderStats.triangles,geometries:renderer.info.memory.geometries,textures:renderer.info.memory.textures},performance:{fpsApprox:fpsMeasuring?null:round(displayFps),fpsMeasuring},containment:verifyContainment(),invariants:verifyInvariants(),simulation:{time:round(clock.time,3),steps:clock.steps,droppedSeconds:round(clock.droppedSeconds,3),fixedStep:STEP},interactionTrace:{events:interactionLog.slice(),truncated:interactionSeq>interactionLimit,total:interactionSeq,elapsedMs:Math.round(performance.now()-interactionStart),coordinates:'normalized canvas coordinates; no text, device identity, or network transmission'},warnings:eyesWarnings};
 probeReport=JSON.stringify(report,null,2);probeText.textContent=probeReport;return report;
}
probeButton.onclick=()=>{probePanel.classList.toggle('open');if(probePanel.classList.contains('open'))inspectWorld()};
document.querySelector('#closeProbe').onclick=()=>probePanel.classList.remove('open');
document.querySelector('#copyProbe').onclick=async()=>{inspectWorld();try{await navigator.clipboard.writeText(probeReport);document.querySelector('#copyProbe').textContent='COPIED'}catch(e){const t=document.createElement('textarea');t.value=probeReport;document.body.append(t);t.select();document.execCommand('copy');t.remove();document.querySelector('#copyProbe').textContent='COPIED'}};
globalThis.BaubleInspect=inspectWorld;
// Bounded, privacy-minimal interaction trace: canvas gestures and instrument controls only.
const interactionLog=[],interactionLimit=240;let interactionSeq=0,interactionStart=performance.now(),gesture=null;
function recordInteraction(type,data={}){interactionLog.push({seq:++interactionSeq,ms:Math.round(performance.now()-interactionStart),type,...data});if(interactionLog.length>interactionLimit)interactionLog.shift()}
function screenPoint(e){const rect=renderer.domElement.getBoundingClientRect();return{x:round((e.clientX-rect.left)/rect.width,3),y:round((e.clientY-rect.top)/rect.height,3)}}
renderer.domElement.addEventListener('pointerdown',e=>{const p=screenPoint(e);if(!gesture)gesture={start:performance.now(),x:p.x,y:p.y,maxPointers:0,moves:0,travel:0};gesture.maxPointers=Math.max(gesture.maxPointers,renderer.domElement.hasPointerCapture(e.pointerId)?1:1);recordInteraction('pointer-down',{pointerType:e.pointerType,button:e.button,...p,camera:{azimuth:round(angle),elevation:round(elev),distance:round(dist)}})},{capture:true});
renderer.domElement.addEventListener('pointermove',e=>{if(!gesture)return;const p=screenPoint(e);gesture.moves++;gesture.travel=Math.max(gesture.travel,Math.hypot(p.x-gesture.x,p.y-gesture.y));gesture.maxPointers=Math.max(gesture.maxPointers,pointers.size)},{capture:false});
function endGesture(e,cancelled=false){const p=screenPoint(e);recordInteraction(cancelled?'pointer-cancel':gesture?.travel<.025?'tap':'gesture-end',{pointerType:e.pointerType,...p,durationMs:gesture?Math.round(performance.now()-gesture.start):null,travel:round(gesture?.travel??0,3),maxPointers:gesture?.maxPointers??1,camera:{azimuth:round(angle),elevation:round(elev),distance:round(dist)}});if(pointers.size<=1)gesture=null}
renderer.domElement.addEventListener('pointerup',e=>endGesture(e),{capture:false});
renderer.domElement.addEventListener('pointercancel',e=>endGesture(e,true),{capture:false});
renderer.domElement.addEventListener('wheel',e=>recordInteraction('wheel',{deltaY:round(e.deltaY),cameraDistance:round(dist)}),{passive:true});
probeButton.addEventListener('click',()=>recordInteraction('inspect-toggle',{open:probePanel.classList.contains('open')}));

const mainRenderStats={calls:0,triangles:0};let last=performance.now();
const fpsLabel=document.querySelector('#fps');
function resetFpsWindow(now){probeFrames=0;probeFrameMs=0;probeLast=now;displayFps=null;fpsMeasuring=true;fpsLabel.textContent='◌ fps'}
document.addEventListener('visibilitychange',()=>{last=performance.now();resetFpsWindow(last)});
window.addEventListener('pageshow',()=>{last=performance.now();resetFpsWindow(last)});
function frame(now){requestAnimationFrame(frame);
 const elapsed=Math.max(0,(now-last)/1000);last=now;
 const validFrame=!document.hidden&&elapsed>0&&elapsed<0.25;
 if(!validFrame){resetFpsWindow(now)}
 else{probeFrames++;probeFrameMs+=elapsed*1000}
 clock.accumulator+=Math.min(MAX_FRAME,validFrame?elapsed:0);
 if(validFrame)clock.droppedSeconds+=Math.max(0,elapsed-MAX_FRAME);
 let steps=0;while(clock.accumulator>=STEP&&steps<MAX_STEPS){simulate(STEP);clock.time+=STEP;clock.steps++;clock.accumulator-=STEP;steps++}
 if(clock.accumulator>=STEP){clock.droppedSeconds+=clock.accumulator;clock.accumulator=0}
 if(validFrame&&now-probeLast>2500){probeLast=now;
  if(probeFrames>=20&&probeFrameMs>0){displayFps=1000*probeFrames/probeFrameMs;fpsMeasuring=false;fpsLabel.textContent=displayFps.toFixed(1)+' fps'}
  verifyInvariants();verifyContainment();if(probePanel.classList.contains('open'))inspectWorld();
  probeFrames=0;probeFrameMs=0}

updateWaterVisual();camera.position.set(Math.sin(angle)*Math.cos(elev)*dist,Math.sin(elev)*dist+targetY,Math.cos(angle)*Math.cos(elev)*dist);camera.lookAt(0,targetY,0);renderer.render(scene,camera);mainRenderStats.calls=renderer.info.render.calls;mainRenderStats.triangles=renderer.info.render.triangles}
requestAnimationFrame(frame);
}catch(e){window.BaubleFatal(e);console.error(e)}

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#0b0910"><title>Spellbook</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0910;color:#e9dfca}canvas{display:block;width:100%;height:100%;touch-action:none}#bar{position:fixed;left:8px;right:8px;bottom:8px;display:flex;gap:6px;overflow-x:auto;padding:4px;scrollbar-width:none}.b{flex:0 0 auto;border:1px solid #51495a;background:#15111bdd;color:#bdb2a4;border-radius:13px;padding:8px 11px;font:11px system-ui}.b.on{color:#f1dfbd;border-color:#aa8d63;background:#261c20}.build{position:fixed;right:10px;top:8px;font:9px ui-monospace,monospace;color:#5f5965;pointer-events:none}</style></head><body><canvas id="c"></canvas><div class="build">BUILD 2df680f1</div><div id="bar"></div><script>
const cv=document.querySelector('#c'),g=cv.getContext('2d'),bar=document.querySelector('#bar');let W,H,D,t=0,last=0,mode='fireball',start=0,seed=9157484;
const names=['fireball','hunger of hadar','grease','web','thunderwave','misty step','shatter','mending'];
function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
names.forEach(n=>{let b=document.createElement('button');b.className='b'+(n===mode?' on':'');b.textContent=n.toUpperCase();b.onclick=()=>{mode=n;start=t;seed=9157484;[...bar.children].forEach(q=>q.classList.toggle('on',q.textContent===n.toUpperCase()))};bar.appendChild(b)});
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function fit(word,max=W*.9){let s=Math.min(88,W*.16);g.font='900 '+s+'px Georgia';while(g.measureText(word).width>max&&s>18){s--;g.font='900 '+s+'px Georgia'}return s}
function letters(word,fn){let s=fit(word),chars=[...word.toUpperCase()],widths=chars.map(c=>g.measureText(c).width),total=widths.reduce((a,b)=>a+b,0),x=(W-total)/2,y=H*.46;chars.forEach((c,i)=>{fn(c,x,y,s,i,chars.length,widths[i]);x+=widths[i]})}
function glyph(c,x,y,s,fill='#e8ddc6',alpha=1){g.globalAlpha=alpha;g.font='900 '+s+'px Georgia';g.textBaseline='middle';g.fillStyle=fill;g.fillText(c,x,y);g.globalAlpha=1}
function fire(age){letters('fireball',(c,x,y,s,i,w)=>{let a=Math.max(0,1-age*.11-i*.025),burn=Math.min(1,age*.16+i*.035);glyph(c,x,y+burn*8,s,'rgb('+(232-burn*80|0)+','+(220-burn*150|0)+','+(198-burn*160|0)+')',a);g.save();g.globalCompositeOperation='screen';for(let k=0;k<5;k++){let q=(i*17+k)*12.9898,rr=Math.sin(q)*43758.5453%1,px=x+w*(.1+Math.abs(rr)*.8),py=y+s*(.2-burn*.55)-k*3;g.fillStyle='rgba(255,105,28,'+(burn*.16)+')';g.beginPath();g.ellipse(px,py,2+burn*4,5+burn*12,0,0,7);g.fill()}g.restore()});
 // ash is what the word became
 if(age>3){g.fillStyle='#625950';for(let i=0;i<90;i++){let q=Math.sin(i*91.7)*43758.5,px=W*.18+Math.abs(q%1)*W*.64,py=H*.53+Math.abs(Math.sin(i*4.1))*Math.min(80,age*8);g.globalAlpha=Math.min(.45,(age-3)*.08);g.fillRect(px,py,1+(i%3),1+(i%2))}g.globalAlpha=1}}
function hadar(age){let cx=W/2,cy=H*.46;letters('hunger of hadar',(c,x,y,s,i,w)=>{let d=Math.abs((x+w/2)-cx)/(W*.46),bite=Math.max(0,1-d-age*.025);g.save();g.beginPath();g.rect(x-2,y-s*.7,w+4,s*1.4);g.clip();glyph(c,x,y,s,'#ddd2c1',1);if(bite>0){let r=s*(.18+bite*.8);let gr=g.createRadialGradient(x+w/2,y,0,x+w/2,y,r);gr.addColorStop(0,'#000');gr.addColorStop(.75,'#05020a');gr.addColorStop(1,'#170c2200');g.fillStyle=gr;g.fillRect(x-10,y-s,x+w+20,s*2)}g.restore()});}
function grease(age){letters('grease',(c,x,y,s,i)=>{let slip=Math.max(0,age-1)*Math.max(0,i-1)*2.5;g.save();g.translate(x,y+Math.min(H*.26,slip));g.rotate(Math.sin(i*2.1)*Math.min(.55,age*.035*i));glyph(c,0,0,s,'#d6c69b');g.restore()});g.strokeStyle='#75664155';g.lineWidth=2;g.beginPath();g.ellipse(W/2,H*.53,W*.3,12,0,0,7);g.stroke()}
function web(age){letters('web',(c,x,y,s,i,w)=>glyph(c,x,y,s));let s=fit('web'),cx=W/2,cy=H*.46,r=Math.min(W*.35,70+age*7);g.strokeStyle='rgba(220,215,202,.35)';g.lineWidth=.7;for(let i=0;i<13;i++){let a=i/13*7;g.beginPath();g.moveTo(cx+Math.cos(a)*20,cy+Math.sin(a)*10);g.quadraticCurveTo(cx+Math.cos(a+.7)*r*.55,cy+Math.sin(a+.7)*r*.35,cx+Math.cos(a)*r,cy+Math.sin(a)*r*.55);g.stroke()}}
function thunder(age){let pulse=Math.min(1,age*.7);letters('thunderwave',(c,x,y,s,i,w)=>{let dir=(x+w/2-W/2),off=dir*age*.08;g.save();g.translate(off,0);g.scale(1+Math.sin(age*8-i)*.025,1);glyph(c,x,y,s,'#d9d6cf',Math.max(.25,1-age*.035));g.restore()});g.strokeStyle='rgba(176,207,224,'+Math.max(0,.5-age*.08)+')';g.lineWidth=2;g.beginPath();g.arc(W/2,H*.46,30+age*38,0,7);g.stroke()}
function misty(age){letters('misty step',(c,x,y,s,i,w)=>{let phase=(age*.7-i*.12),jump=phase>1?W*.12:0,fade=Math.abs((phase%2)-1);glyph(c,x+jump,y,s,'#c9c1d7',.25+.75*fade)});for(let i=0;i<35;i++){let a=i*.7+age*.2,r=20+i*1.8;g.fillStyle='rgba(164,151,185,.08)';g.fillRect(W*.5+Math.cos(a)*r,H*.46+Math.sin(a)*r*.35,2,2)}}
function shatter(age){letters('shatter',(c,x,y,s,i,w)=>{let a=Math.max(0,age-1),ang=(i-3)*.18,dx=Math.cos(ang)*a*a*3*(i-3),dy=Math.sin(ang)*a*a*8+a*a*3;g.save();g.translate(dx,dy);g.rotate((i-3)*a*.035);glyph(c,x,y,s,'#ddd4c4',Math.max(0,1-a*.06));g.restore()})}
function mend(age){let a=Math.min(1,age*.22);letters('mending',(c,x,y,s,i,w)=>{let dx=(i%2?1:-1)*(1-a)*(35+i*7),dy=(1-a)*((i%3)-1)*45;glyph(c,x+dx,y+dy,s,'#ded6c6',.35+.65*a)});g.strokeStyle='rgba(190,174,139,'+(1-a)*.35+')';for(let i=0;i<7;i++){g.beginPath();g.moveTo(W*.2+i*W*.09,H*.4);g.lineTo(W*.25+i*W*.08,H*.52);g.stroke()}}
function draw(){let age=t-start;g.fillStyle='#0b0910';g.fillRect(0,0,W,H);let glow=g.createRadialGradient(W/2,H*.46,10,W/2,H*.46,Math.min(W,H)*.48);glow.addColorStop(0,'#211b24');glow.addColorStop(1,'#0b0910');g.fillStyle=glow;g.fillRect(0,0,W,H);if(mode==='fireball')fire(age);else if(mode==='hunger of hadar')hadar(age);else if(mode==='grease')grease(age);else if(mode==='web')web(age);else if(mode==='thunderwave')thunder(age);else if(mode==='misty step')misty(age);else if(mode==='shatter')shatter(age);else mend(age);g.fillStyle='#5f5863';g.font='10px system-ui';g.textAlign='center';g.fillText('tap another word to cast again',W/2,H*.72)}
function frame(n){let dt=Math.min(.05,(n-last)/1000||0);last=n;t+=dt;draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>

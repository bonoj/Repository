<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#090812"><title>Hunger of Hadar — Spellbook</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090812;color:#eee4d0;font-family:Georgia,serif}canvas{display:block;width:100%;height:100%;touch-action:none}
#sigil{position:fixed;left:14px;top:12px;pointer-events:none;text-shadow:0 2px 10px #000}.name{font-size:13px;letter-spacing:.2em;color:#d8c9aa}.sub{font:10px system-ui;color:#847b88;margin-top:3px;letter-spacing:.06em}
#note{position:fixed;right:12px;bottom:12px;text-align:right;font:9px/1.35 system-ui;color:#6f6875;pointer-events:none}
</style></head><body><canvas id="c"></canvas><div id="sigil"><div class="name">HUNGER OF HADAR</div><div class="sub">a region of the world has become wrong</div></div><div id="note">darkness · difficult terrain · exposure<br>the boundary is known by consequence</div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,D,seed=741;
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function resize(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);paint()}addEventListener('resize',resize);
function path(points,close=false){x.beginPath();x.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)x.lineTo(points[i][0],points[i][1]);if(close)x.closePath()}
function stone(poly,fill,stroke='#665e68'){path(poly,true);x.fillStyle=fill;x.fill();x.strokeStyle=stroke;x.lineWidth=1;x.stroke()}
function figure(px,py,scale,inside=false,lean=0){
 x.save();x.translate(px,py);x.rotate(lean);x.lineCap='round';x.lineJoin='round';
 x.strokeStyle=inside?'#30283c':'#cbbd9d';x.fillStyle=inside?'#17131f':'#b7a987';x.lineWidth=2.2*scale;
 x.beginPath();x.arc(0,-11*scale,3.2*scale,0,7);x.fill();x.stroke();
 x.beginPath();x.moveTo(0,-7*scale);x.lineTo(-1,5*scale);x.moveTo(-1,-2*scale);x.lineTo(-7*scale,3*scale);x.moveTo(-1,-1*scale);x.lineTo(6*scale,-5*scale);x.moveTo(-1,5*scale);x.lineTo(-6*scale,13*scale);x.moveTo(-1,5*scale);x.lineTo(5*scale,13*scale);x.stroke();
 x.restore()
}
function paint(){seed=741;x.clearRect(0,0,W,H);
 let bg=x.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#15131c');bg.addColorStop(1,'#080810');x.fillStyle=bg;x.fillRect(0,0,W,H);
 const top=55,bottom=H-38,cx=W*.53,cy=top+(bottom-top)*.52,R=Math.min(W*.34,(bottom-top)*.32);
 // floor: one connected architectural field, not tiled rectangles
 let floor=[[18,top+15],[W-18,top],[W-8,bottom-8],[26,bottom]];stone(floor,'#24212a','#817665');
 // perspective masonry seams
 x.save();path(floor,true);x.clip();x.strokeStyle='#39343c';x.lineWidth=.8;
 for(let i=-4;i<10;i++){let yy=top+i*42;x.beginPath();x.moveTo(0,yy);x.lineTo(W,yy+18);x.stroke()}
 for(let i=-3;i<10;i++){let xx=i*62;x.beginPath();x.moveTo(xx,top);x.lineTo(W*.5+(xx-W*.5)*1.35,bottom);x.stroke()}x.restore();
 // broken connected wall / choke, with aperture centered on Hadar
 const wx=W*.28; x.strokeStyle='#746b61';x.lineWidth=12;x.lineCap='butt';
 x.beginPath();x.moveTo(wx,top+8);x.lineTo(wx,cy-R*.72);x.moveTo(wx,cy+R*.75);x.lineTo(wx,bottom-10);x.stroke();
 x.strokeStyle='#2d2930';x.lineWidth=7;x.setLineDash([18,3]);x.beginPath();x.moveTo(wx,top+8);x.lineTo(wx,cy-R*.72);x.moveTo(wx,cy+R*.75);x.lineTo(wx,bottom-10);x.stroke();x.setLineDash([]);
 // cold spill outside boundary: consequences precede the hole
 let cold=x.createRadialGradient(cx,cy,R*.72,cx,cy,R*1.32);cold.addColorStop(0,'#604f7860');cold.addColorStop(.62,'#342b4840');cold.addColorStop(1,'#11101a00');x.fillStyle=cold;x.beginPath();x.arc(cx,cy,R*1.32,0,7);x.fill();
 // objects cut by boundary: weapon and fallen standard vanish rather than tint
 x.strokeStyle='#b8a77e';x.lineWidth=3;x.beginPath();x.moveTo(cx-R*1.15,cy+R*.48);x.lineTo(cx-R*.55,cy+R*.18);x.stroke();
 // Hadar: layered irregular silhouette; gameplay truth may be circular, perception isn't
 x.save();x.translate(cx,cy);
 for(let layer=0;layer<5;layer++){let rr=R*(1.04-layer*.012);x.beginPath();for(let i=0;i<=96;i++){let a=i/96*Math.PI*2,noise=Math.sin(a*7+layer)*.018+Math.sin(a*13+1.7)*.009+(rnd()-.5)*.008;let r=rr*(1+noise);let px=Math.cos(a)*r,py=Math.sin(a)*r;if(i)x.lineTo(px,py);else x.moveTo(px,py)}x.closePath();x.fillStyle=layer<2?'#120d1d':'#020207';x.fill()}
 // rim: not a neon circle; sparse stellar/cold fractures
 x.globalCompositeOperation='screen';
 for(let i=0;i<70;i++){let a=rnd()*Math.PI*2,r=R*(.96+rnd()*.12),len=2+rnd()*10;x.strokeStyle=rnd()>.45?'#79629b55':'#b6d9dd44';x.lineWidth=.5+rnd();x.beginPath();x.moveTo(Math.cos(a)*r,Math.sin(a)*r);x.lineTo(Math.cos(a)*(r+len),Math.sin(a)*(r+len));x.stroke()}
 for(let i=0;i<34;i++){let a=rnd()*Math.PI*2,r=R*(.35+rnd()*.58),s=.4+rnd()*1.4;x.fillStyle=rnd()>.75?'#d7c4e4aa':'#71668788';x.fillRect(Math.cos(a)*r,Math.sin(a)*r,s,s)}
 x.globalCompositeOperation='source-over';
 // tendrils / impossible depth
 x.strokeStyle='#46355366';x.lineWidth=1;for(let i=0;i<9;i++){let a=i/9*Math.PI*2+rnd()*.3;x.beginPath();x.moveTo(Math.cos(a)*R*.9,Math.sin(a)*R*.9);x.bezierCurveTo(Math.cos(a+1)*R*.45,Math.sin(a+1)*R*.45,Math.cos(a-1.2)*R*.28,Math.sin(a-1.2)*R*.28,0,0);x.stroke()}
 x.restore();
 // frost / residue accumulates against the inaccessible boundary
 x.strokeStyle='#a9c4c777';x.lineWidth=1.2;for(let i=0;i<45;i++){let a=Math.PI*.58+rnd()*Math.PI*.72,r=R*(1.015+rnd()*.035),px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;x.beginPath();x.moveTo(px,py);x.lineTo(px+(rnd()-.5)*8,py+2+rnd()*7);x.stroke()}
 // figures: posture and disappearance tell the rules
 figure(cx-R*1.33,cy-R*.18,1.05,false,.12); // approaching / bracing
 figure(cx-R*.82,cy+R*.08,1,true,-.25);    // swallowed at edge
 figure(cx+R*.74,cy-R*.18,.95,true,.22);   // barely legible within
 figure(cx+R*1.22,cy+R*.62,1,false,-.1);   // escaping
 // one dragged footprint trail that terminates at darkness
 x.strokeStyle='#8d7e6c88';x.lineWidth=1;for(let i=0;i<5;i++){let px=cx-R*(1.38-i*.1),py=cy+R*(.42-i*.045);x.beginPath();x.ellipse(px,py,2.3,4,.7,0,7);x.stroke()}
 // subtle vignette
 let vg=x.createRadialGradient(W*.5,H*.5,Math.min(W,H)*.2,W*.5,H*.5,Math.max(W,H)*.7);vg.addColorStop(.55,'#0000');vg.addColorStop(1,'#000b');x.fillStyle=vg;x.fillRect(0,0,W,H)
}
resize();
</script></body></html>

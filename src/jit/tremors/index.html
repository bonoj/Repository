<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TREMORS · The Unquiet Earth</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c12;color:#e8cf9c;font-family:system-ui}canvas{display:block;touch-action:none}#top{position:fixed;top:env(safe-area-inset-top);left:0;right:0;text-align:center;pointer-events:none;padding-top:15px;text-shadow:0 2px 10px #000}h1{font:normal 32px Georgia;letter-spacing:.18em;margin:0}small{font-size:10px;letter-spacing:.2em;color:#b9a47f}#hud{position:fixed;bottom:0;left:0;right:0;padding:24px 10px max(20px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#080c12ed 40%);text-align:center}#controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}button{min-height:48px;padding:12px 16px;border-radius:10px;border:1px solid #967c51;background:#20252b;color:#f1d49b;font:600 12px system-ui}button.active{background:#6c4c2c}#status{font:11px monospace;color:#bfc0b7;margin:0 0 12px}#error{position:fixed;top:25%;left:8%;right:8%;color:#ffc0aa;white-space:pre-wrap;font:13px monospace}</style></head><body><div id="top"><h1>TREMORS</h1><small>THE UNQUIET EARTH · 001</small></div><div id="hud"><div id="status">TAP THE MOUNTAIN · DRAG TO ORBIT</div><div id="controls"><button id="strike" class="active">☄ IMPACT</button><button id="rain">⛰ SCREE</button><button id="reset">↻ RESET</button></div></div><div id="error"></div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
try{
const scene=new T.Scene();scene.background=new T.Color(0x080e18);scene.fog=new T.FogExp2(0x101724,.024);
const camera=new T.PerspectiveCamera(43,1,.1,150),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0x9fbdd0,0x382314,2));const sun=new T.DirectionalLight(0xffc48a,3);sun.position.set(-7,13,8);scene.add(sun);
const mat=(c,m=0,r=.8)=>new T.MeshStandardMaterial({color:c,metalness:m,roughness:r});
const brass=mat(0x977044,.75,.35),stone=mat(0x51504c),dark=mat(0x272b30),sand=mat(0x99816b);
const root=new T.Group();scene.add(root);const R=7.2, N=64, S=R*2/N, H=new Float32Array(N*N), tmp=new Float32Array(N*N);
function cell(x,z){return z*N+x}function inside(x,z){return x>=1&&z>=1&&x<N-1&&z<N-1&&Math.hypot(x-N/2+.5,z-N/2+.5)<N*.47}
function reset(){for(let z=0;z<N;z++)for(let x=0;x<N;x++){let d=Math.hypot(x-N/2,z-N/2)/(N*.47);H[cell(x,z)]=inside(x,z)?Math.max(0,5.7*(1-d)**1.35+(.18*Math.sin(x*.72)*Math.cos(z*.57))*(1-d)):0}grains.length=0;settled=0;updateTerrain()}
const geo=new T.PlaneGeometry(R*2,R*2,N-1,N-1);geo.rotateX(-Math.PI/2);const terrain=new T.Mesh(geo,new T.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:.94,side:T.DoubleSide}));root.add(terrain);
const colors=new Float32Array(N*N*3);const c=new T.Color();
function updateTerrain(){const pos=geo.attributes.position;for(let z=0;z<N;z++)for(let x=0;x<N;x++){let i=cell(x,z),h=H[i];pos.setY(i,h);c.setHSL(.075+Math.min(h/70,.04),.09+Math.min(h*.017,.09),.19+Math.min(h*.032,.19));colors[i*3]=c.r;colors[i*3+1]=c.g;colors[i*3+2]=c.b}geo.setAttribute('color',new T.BufferAttribute(colors,3));pos.needsUpdate=true;geo.computeVertexNormals()}
const floor=new T.Mesh(new T.CylinderGeometry(R+.18,R+.3,.55,64),dark);floor.position.y=-.33;root.add(floor);
const rim=new T.Mesh(new T.TorusGeometry(R,.15,10,96),brass);rim.rotation.x=Math.PI/2;rim.position.y=.06;root.add(rim);
const base=new T.Mesh(new T.CylinderGeometry(R+.4,R+.25,.3,64),brass);base.position.y=-.67;root.add(base);
const globe=new T.Mesh(new T.SphereGeometry(9.4,64,40),new T.MeshPhysicalMaterial({color:0x8ca9b9,transparent:true,opacity:.075,depthWrite:false,roughness:.12,side:T.BackSide}));globe.position.y=1;root.add(globe);
const MAX=2800,beadGeo=new T.IcosahedronGeometry(.095,0),beads=new T.InstancedMesh(beadGeo,sand,MAX);beads.instanceMatrix.setUsage(T.DynamicDrawUsage);beads.frustumCulled=false;root.add(beads);const dummy=new T.Object3D(),grains=[];let settled=0,impacts=0,mode='strike',dirty=false;
function height(x,z){let ix=Math.max(0,Math.min(N-1,Math.floor((x+R)/S))),iz=Math.max(0,Math.min(N-1,Math.floor((z+R)/S)));return H[cell(ix,iz)]}
function drop(x,z,y,vx=0,vz=0){if(grains.length>=MAX)return;grains.push({x,y,z,vx,vy:0,vz})}
function impact(x,z){impacts++;let ix=Math.floor((x+R)/S),iz=Math.floor((z+R)/S);for(let dz=-7;dz<=7;dz++)for(let dx=-7;dx<=7;dx++){let a=ix+dx,b=iz+dz;if(!inside(a,b))continue;let dist=Math.hypot(dx,dz);if(dist>6)continue;let i=cell(a,b),take=Math.min(H[i],Math.max(0,1-dist/6)*(.5+Math.random()*.45));H[i]-=take;let n=Math.ceil(take*2);for(let j=0;j<n;j++)drop((a+.5)*S-R,(b+.5)*S-R,H[i]+.4+Math.random()*1.5,dx*.22+(Math.random()-.5)*1.2,dz*.22+(Math.random()-.5)*1.2)}dirty=true}
function scree(x,z){for(let j=0;j<160;j++)drop(x+(Math.random()-.5)*1.2,z+(Math.random()-.5)*1.2,7+Math.random()*4,(Math.random()-.5)*.6,(Math.random()-.5)*.6)}
function settle(x,z){let ix=Math.floor((x+R)/S),iz=Math.floor((z+R)/S);if(!inside(ix,iz))return;H[cell(ix,iz)]+=.075;settled++;dirty=true}
function step(dt){for(let i=grains.length-1;i>=0;i--){let p=grains[i];p.vy-=15*dt;p.x+=p.vx*dt;p.z+=p.vz*dt;p.y+=p.vy*dt;let radius=Math.hypot(p.x,p.z);if(radius>R-.25){let nx=p.x/radius,nz=p.z/radius;p.x=nx*(R-.25);p.z=nz*(R-.25);let dot=p.vx*nx+p.vz*nz;if(dot>0){p.vx-=dot*1.3*nx;p.vz-=dot*1.3*nz}}if(p.y<=height(p.x,p.z)+.09){settle(p.x,p.z);grains.splice(i,1)}}if(dirty){updateTerrain();dirty=false}beads.count=grains.length;for(let i=0;i<grains.length;i++){let p=grains[i];dummy.position.set(p.x,p.y,p.z);dummy.updateMatrix();beads.setMatrixAt(i,dummy.matrix)}beads.instanceMatrix.needsUpdate=true}
reset();let az=.6,el=.48,dist=22;function view(){camera.position.set(Math.sin(az)*Math.cos(el)*dist,Math.sin(el)*dist+2,Math.cos(az)*Math.cos(el)*dist);camera.lookAt(0,1.3,0)}view();
let down=null;const ray=new T.Raycaster(),pointer=new T.Vector2();function tap(x,y){pointer.set(x/innerWidth*2-1,1-y/innerHeight*2);ray.setFromCamera(pointer,camera);const hits=ray.intersectObject(terrain);if(hits.length){let p=hits[0].point;if(mode==='strike')impact(p.x,p.z);else scree(p.x,p.z)}}
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,az,el,id:e.pointerId};renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!down||down.id!==e.pointerId)return;az=down.az+(e.clientX-down.x)*.007;el=Math.max(.12,Math.min(1.25,down.el+(e.clientY-down.y)*.006));view()});
renderer.domElement.addEventListener('pointerup',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<9)tap(e.clientX,e.clientY);down=null});
renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(14,Math.min(35,dist+e.deltaY*.015));view()},{passive:true});
document.querySelector('#strike').onclick=()=>{mode='strike';document.querySelector('#strike').classList.add('active');document.querySelector('#rain').classList.remove('active')};
document.querySelector('#rain').onclick=()=>{mode='rain';document.querySelector('#rain').classList.add('active');document.querySelector('#strike').classList.remove('active')};
document.querySelector('#reset').onclick=()=>{reset();impacts=0};
const status=document.querySelector('#status');let last=performance.now(),acc=0;function frame(t){requestAnimationFrame(frame);let dt=Math.min(.05,(t-last)/1000);last=t;acc+=dt;let count=0;while(acc>=1/60&&count++<3){step(1/60);acc-=1/60}status.textContent='ACTIVE '+grains.length+' · DEPOSITED '+settled+' · IMPACTS '+impacts+' · GRAVITY ↓';renderer.render(scene,camera)}requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(e){document.querySelector('#error').textContent=String(e.stack||e)}
</script></body></html>

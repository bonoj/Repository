 const drive=1.3,dx=Math.sin(b.heading),dz=Math.cos(b.heading);
 b.vx+=(dx*drive+(c.vx-b.vx)*1.45)*dt;
 b.vz+=(dz*drive+(c.vz-b.vz)*1.45)*dt;
 b.x+=b.vx*dt;b.z+=b.vz*dt;
 const distance=Math.hypot(b.x,b.z);
 if(distance>safe){b.x*=safe/distance;b.z*=safe/distance;const radial=(b.vx*b.x+b.vz*b.z)/safe;if(radial>0){b.vx-=radial*b.x/safe;b.vz-=radial*b.z/safe}}
 const surface=localWaterHeight(b.x,b.z);
 b.y+=(surface-.1-b.y)*Math.min(1,dt*7);
 const hF=localWaterHeight(b.x+dx*.6,b.z+dz*.6),hB=localWaterHeight(b.x-dx*.6,b.z-dz*.6);
 const hL=localWaterHeight(b.x+dz*.35,b.z-dx*.35),hR=localWaterHeight(b.x-dz*.35,b.z+dx*.35);
 b.pitch+=(Math.atan2(hF-hB,1.2)-b.pitch)*Math.min(1,dt*5);
 b.roll+=(Math.atan2(hL-hR,.7)-b.roll)*Math.min(1,dt*5);
 skiff.position.set(b.x,b.y,b.z);skiff.rotation.order='YXZ';skiff.rotation.set(b.pitch,b.heading,b.roll,'YXZ');

}
function simulate(dt){
 const t=Math.min(dt,.022);simSteps++;simTime+=t;stepWater(t);stepBoat(t);
 if(dripEnabled){emitCarry+=emitRate*t;const n=Math.min(160,Math.floor(emitCarry));let spawned=0;for(;spawned<n;spawned++)if(!spawnOne())break;emitCarry-=spawned;}
 const limit=INNER_R-BEAD_R;
 // Seed the first liquid on contact with the vessel, then merge at the waterline.
 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];p.life+=t;const dx=gravityPosition.x-p.x,dy=gravityPosition.y-p.y,dz=gravityPosition.z-p.z;const d2=dx*dx+dy*dy+dz*dz+gravitySoftening*gravitySoftening;const accel=GRAVITY*gravityOrbitalRadius*gravityOrbitalRadius/(d2*Math.sqrt(d2));p.vx+=dx*accel*t;p.vy+=dy*accel*t;p.vz+=dz*accel*t;
  // Thick horizontal airflow band; lateral drag stays subordinate to gravity.
  const height=p.y-localWaterHeight(p.x,p.z);
  const band=Math.exp(-Math.pow((height-1.1)/2.3,2));
  const air=2.1*band*t;
  windSpeed=3.1+13*windGust();
  const push=(windSpeed-p.vx)*air;
  p.vx+=push;p.vz+=(-p.vz)*air*.38;
  windImpulse+=Math.abs(push);if(band>.15)windAffected++;
  p.x+=p.vx*t;p.y+=p.vy*t;p.z+=p.vz*t;
  const r2=p.x*p.x+p.y*p.y+p.z*p.z;
  if(r2>limit*limit){
   const r=Math.sqrt(r2),nx=p.x/r,ny=p.y/r,nz=p.z/r;
   p.x=nx*limit;p.y=ny*limit;p.z=nz*limit;
   const vn=p.vx*nx+p.vy*ny+p.vz*nz;
   if(vn>0){p.vx-=1.24*vn*nx;p.vy-=1.24*vn*ny;p.vz-=1.24*vn*nz}
   p.vx*=.79;p.vz*=.79;collisionCount++;
   if(settledCount===0){settle(p);particles[i]=particles[particles.length-1];particles.pop();continue;}
  }
  if(!p.splash&&Math.hypot(p.x-boatState.x,p.z-boatState.z)<.48&&p.y>=boatState.y-.02&&p.y<=boatState.y+.8&&p.vy<0){boatState.cargoUnits++;boatState.caught++;particles[i]=particles[particles.length-1];particles.pop();continue;}
  const depth=p.y;const downward=-p.vy;
  if(settledCount>0 && depth<=localWaterHeight(p.x,p.z)+BEAD_R && downward>0){
   if(p.splash)settle(p);else splash(p,downward);particles[i]=particles[particles.length-1];particles.pop();
  }
 }
}
